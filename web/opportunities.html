<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Security: scripts only from this site. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self' mailto:">
<link rel="icon" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/opportunities.css">
<title>Opportunities | Cultus Youth</title>
</head>
<body data-title="nav.opps">
<nav><div class="wrap">
<a class="logo" href="index.html" aria-label="Cultus Youth"><img src="assets/logo.jpg" alt="Cultus Youth logo" width="56" height="56"></a>
<a class="tab" href="index.html" id="t-home" data-i18n-aria="nav.home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
<a class="tab" href="opportunities.html" id="t-opps" data-i18n-aria="nav.opps" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8 9 6 5 6c0 4 3 6 7 6z"/><path d="M12 14c0-3 2-5 6-5 0 3-2 5-6 5z"/></svg></a>
<button class="tab" id="lang" data-i18n-aria="nav.lang">ع</button>
<button class="tab" id="theme" data-i18n-aria="nav.theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor"/></svg></button>
</div></nav>
<main><div class="wrap page">
<h1 data-i18n="o.title"></h1>
<p class="sync" id="count" aria-live="polite"></p>
<div class="chips" id="tracks" role="group"></div>
<div class="bar">
<input id="q" maxlength="100" data-i18n-ph="o.search" data-i18n-aria="o.search">
<select id="type" data-i18n-aria="f.type"></select>
<select id="mode" data-i18n-aria="f.mode"></select>
<select id="sort" data-i18n-aria="sort.d"></select>
<button class="chip on" id="hide" aria-pressed="true" data-i18n="hide"></button>
</div>
<div class="grid" id="grid"></div>
<p id="empty" class="meta" hidden data-i18n="empty"></p>
<section class="panel"><h2 data-i18n="sg.title"></h2><p class="meta" data-i18n="sg.p"></p><a class="btn" id="suggest" href="#" data-i18n="sg.btn"></a></section>
</div></main>
<footer><div class="wrap" data-i18n="footer"></div></footer>
<button id="fab" aria-expanded="false" aria-controls="chat" data-i18n="chat.fab"></button>
<div id="chat" role="dialog" aria-labelledby="chat-t">
<header><strong id="chat-t" data-i18n="chat.title"></strong><button id="cx" data-i18n-aria="close">x</button></header>
<div id="msgs" aria-live="polite"></div><div id="qc"></div>
<form id="cf"><input id="ci" maxlength="500" autocomplete="off" data-i18n-ph="chat.ph" data-i18n-aria="chat.ph"><button class="btn" data-i18n="send"></button></form>
</div>
<script type="module" src="js/opportunities.js"></script>
</body>
</html>
